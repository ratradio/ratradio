<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My RAT | RAT Radio</title>

<style>
/* ================= CSS PATEN ================= */
*{ 
    margin:0; padding:0; box-sizing:border-box; 
    font-family: 'Inter', Helvetica, Arial, sans-serif; 
    -webkit-user-select: none; 
    user-select: none;                   
}
body{ background:#000; color:#fff; overflow-x: hidden; }

.header-container { position: fixed; top: 0; width: 100%; z-index: 1000; }
.nav-top { height: 48px; background: #000; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #fff; padding: 0 15px; }
.logo-main img { height: 46px; cursor: pointer; }
.menu-links a { color: #fff; text-decoration: none; font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 0 15px; }
.nav-live { height: 32px; background: #000; display: flex; align-items: center; border-bottom: 1px solid #fff; }
.live-label { background: #fff; color: #000; height: 100%; padding: 0 12px; font-size: 10px; font-weight: 700; display: flex; align-items: center; gap: 6px; text-transform: uppercase; }
.live-label span { color: #ff0000; animation: blink 1.5s infinite; } 
@keyframes blink { 0%, 100% {opacity:1;} 50% {opacity:0.2;} }
.current-show { padding: 0 15px; font-size: 11px; font-weight: 700; display: flex; align-items: center; text-transform: uppercase; }
.btn-toggle-small { cursor: pointer; margin-right: 12px; }
.stop-square-small { width: 10px; height: 10px; background: #fff; }

/* ================= MY RAT LAYOUT ================= */
.my-rat-hero { padding: 120px 60px 40px 60px; }
.my-rat-hero h2 { font-size: 85px; font-weight: 800; letter-spacing: -5px; line-height: 0.8; text-transform: uppercase; }

.shows-section { padding: 0 60px 60px 60px; }
.section-header { border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 15px; margin-bottom: 30px; }
.section-header h3 { font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: -1px; }

.list-item { 
    display: flex; align-items: center; 
    padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.1);
    cursor: pointer; transition: 0.2s;
}
.list-item:hover { background: rgba(255,255,255,0.03); }

.item-cover { width: 80px; height: 80px; filter: grayscale(100%); object-fit: cover; margin-right: 25px; border: 1px solid rgba(255,255,255,0.1); }
.item-info { flex: 1; }
.item-info b { display: block; font-size: 18px; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; }
.item-info span { font-size: 12px; opacity: 0.5; }

.item-actions { 
    display: flex; gap: 20px; align-items: center; justify-content: flex-end; height: 80px; 
}
.action-text {
    font-size: 11px; font-weight: 700; text-transform: uppercase; color: #fff; 
    cursor: pointer; opacity: 0.5; transition: 0.2s;
}
.action-text:hover { opacity: 1; }
.action-text.copied { opacity: 1 !important; font-weight: 900; }

/* ================= PLAYER & DRAWER ================= */
.player-fixed {
  position: fixed; bottom: 0; width: 100%; height: 55px; 
  background: #000; color: #fff; display: none; 
  align-items: center; justify-content: space-between; 
  z-index: 1000; border-top: 1px solid rgba(255,255,255,0.2);
}
.progress-container { position: absolute; top: -3px; left: 0; width: 100%; height: 6px; background: rgba(255,255,255,0.1); cursor: pointer; }
.progress-bar { height: 100%; background: #fff; width: 0%; }
.player-left { display: flex; align-items: center; padding-left: 20px; gap: 15px; }
.track-box { display: flex; align-items: center; gap: 12px; }
.track-box img { width: 38px; height: 38px; border: 1px solid #fff; filter: grayscale(100%); }
.title-info b { font-size: 12px; display: block; text-transform: uppercase; }
.title-info span { font-size: 10px; opacity: 0.7; }

#tracklist-drawer {
    display: none; position: fixed; bottom: 55px; left: 0; width: 100%; height: calc(100vh - 135px); 
    background: #000; z-index: 998; overflow-y: auto; opacity: 0; transition: 0.3s;
}
#tracklist-drawer.active { display: block; opacity: 1; }
.drawer-wide-shape { padding: 80px 60px; position: relative; }
.drawer-content-inner { display: flex; gap: 70px; max-width: 1200px; margin: 0 auto; }
.drawer-cover-side img { width: 380px; aspect-ratio: 1/1; object-fit: cover; border: 1px solid rgba(255,255,255,0.1); }
.drawer-title-big { font-size: 60px; font-weight: 800; letter-spacing: -3px; text-transform: uppercase; margin-bottom: 30px; }
.close-drawer-btn { position: absolute; top: 40px; right: 60px; cursor: pointer; font-weight: 800; opacity: 0.5; }

/* ================= FOOTER ================= */
footer { background: #000; padding: 80px 60px; border-top: 1px solid rgba(255,255,255,0.2); margin-top: 50px; text-align: center; }
.footer-logo-img { height: 85px; margin-bottom: 20px; }
</style>
</head>
<body>

<div class="header-container">
  <div class="nav-top">
    <div class="logo-main" onclick="window.location.href='index.html'"><img src="New Project (3).png"></div>
    <div class="menu-links">
        <a href="index.html">Latest</a>
        <a href="explore.html">Explore</a>
        <a href="shop.html">Shop</a>
        <a href="my-rat.html" style="color:#888;">My RAT</a>
        <a href="about.html">About</a>
    </div>
  </div>
  <div class="nav-live">
    <div class="live-label">Live Now <span>●</span></div>
    <div class="current-show">
        <div class="btn-toggle-small" id="toggle-small">▶</div> 
        <span id="live-text-source">BASEMENT SESSIONS W/ DIRTY CAT</span>
    </div>
  </div>
</div>

<div class="my-rat-hero">
    <h2>MY RAT</h2>
</div>

<section class="shows-section">
    <div class="section-header"><h3>SAVED SHOWS</h3></div>
    <div class="history-list" id="saved-container">
        </div>
</section>

<section class="shows-section">
    <div class="section-header"><h3>HISTORY</h3></div>
    <div class="history-list" id="history-container">
        <div class="list-item" onclick="changeTrack('THE SEWER GHOST', 'GHOSTFACE', 'https://i.pinimg.com/736x/4a/95/38/4a9538d1ecde6f01fca8fd9c89f1ab9f.jpg')">
            <img src="https://i.pinimg.com/736x/4a/95/38/4a9538d1ecde6f01fca8fd9c89f1ab9f.jpg" class="item-cover">
            <div class="item-info">
                <b>THE SEWER GHOST</b>
                <span>12 FEB 2026</span>
            </div>
            <div class="item-actions">
                <span class="action-text" onclick="event.stopPropagation(); shareShow(this, 'THE SEWER GHOST')">SHARE</span>
                <span class="action-text" onclick="event.stopPropagation(); openView('THE SEWER GHOST', 'https://i.pinimg.com/736x/4a/95/38/4a9538d1ecde6f01fca8fd9c89f1ab9f.jpg')">VIEW ↗</span>
                <span class="action-text" onclick="event.stopPropagation(); this.parentElement.parentElement.remove();">DELETE</span>
            </div>
        </div>
    </div>
</section>

<footer>
    <img src="New Project (3).png" class="footer-logo-img">
    <div style="font-size: 10px; color: #444;">2026</div>
</footer>

<div class="player-fixed" id="main-player">
  <div class="progress-container" id="p-cont"><div class="progress-bar" id="p-bar"></div></div>
  <div class="player-left">
    <div class="btn-toggle-bottom" id="toggle-bottom">▶</div>
    <div class="track-box">
      <img src="" id="bottom-cover">
      <div class="title-info"><b id="player-title">TITLE</b><span id="player-sub">SUBTITLE</span></div>
    </div>
  </div>
  <div class="close-btn" id="close-player" style="padding: 20px; cursor: pointer;">✕</div>
</div>

<div id="tracklist-drawer">
    <div class="drawer-wide-shape">
        <div class="close-drawer-btn" onclick="toggleDrawer()">✕ CLOSE</div>
        <div class="drawer-content-inner">
            <div class="drawer-cover-side"><img id="drawer-cover-img" src=""></div>
            <div class="drawer-text-side">
                <h2 id="drawer-title-big" class="drawer-title-big">TITLE</h2>
                <p style="opacity:0.5">TRACKLIST UNAVAILABLE</p>
            </div>
        </div>
    </div>
</div>

<script>
    const playerBar = document.getElementById('main-player');
    const playerTitle = document.getElementById('player-title');
    const playerSub = document.getElementById('player-sub');
    const bottomCover = document.getElementById('bottom-cover');
    const drawer = document.getElementById('tracklist-drawer');

    // FUNGSI DRAWER
    function toggleDrawer() {
        if (drawer.classList.contains('active')) {
            drawer.classList.remove('active');
            setTimeout(() => { drawer.style.display = 'none'; }, 300);
        } else {
            drawer.style.display = 'block';
            setTimeout(() => { drawer.classList.add('active'); }, 10);
        }
    }

    // FUNGSI CHANGE TRACK
    function changeTrack(title, sub, img) {
        playerTitle.innerText = title;
        playerSub.innerText = sub;
        bottomCover.src = img;
        playerBar.style.display = 'flex';
        // Logic play audio di sini
    }

    // FUNGSI VIEW (Memperbaiki VIEW yang tidak jalan)
    function openView(title, img) {
        document.getElementById('drawer-title-big').innerText = title.toUpperCase();
        document.getElementById('drawer-cover-img').src = img;
        toggleDrawer();
    }

    // FUNGSI SHARE (Warna tetap putih saat copied)
    function shareShow(element, title) {
        const link = window.location.origin + "/show/" + title.replace(/\s+/g, '-').toLowerCase();
        navigator.clipboard.writeText(link).then(() => {
            const original = element.innerText;
            element.innerText = "COPIED";
            element.classList.add('copied');
            setTimeout(() => {
                element.innerText = original;
                element.classList.remove('copied');
            }, 2000);
        });
    }

    // LOAD SAVED SHOWS DARI LOCALSTORAGE
    function loadSaved() {
        const container = document.getElementById('saved-container');
        const data = JSON.parse(localStorage.getItem('rat_saved')) || [];
        if (data.length === 0) {
            container.innerHTML = '<p style="font-size:11px; opacity:0.5;">No saved shows yet.</p>';
            return;
        }
        container.innerHTML = '';
        data.forEach((show, i) => {
            const div = document.createElement('div');
            div.className = 'list-item';
            div.onclick = () => changeTrack(show.title, show.sub, show.img);
            div.innerHTML = `
                <img src="${show.img}" class="item-cover">
                <div class="item-info"><b>${show.title}</b><span>${show.date}</span></div>
                <div class="item-actions">
                    <span class="action-text" onclick="event.stopPropagation(); shareShow(this, '${show.title}')">SHARE</span>
                    <span class="action-text" onclick="event.stopPropagation(); openView('${show.title}', '${show.img}')">VIEW ↗</span>
                    <span class="action-text" onclick="event.stopPropagation(); removeSaved(${i})">DELETE</span>
                </div>`;
            container.appendChild(div);
        });
    }

    function removeSaved(i) {
        let data = JSON.parse(localStorage.getItem('rat_saved'));
        data.splice(i, 1);
        localStorage.setItem('rat_saved', JSON.stringify(data));
        loadSaved();
    }

    document.getElementById('close-player').onclick = () => { playerBar.style.display = 'none'; };
    window.onload = loadSaved;
</script>
</body>
</html>
