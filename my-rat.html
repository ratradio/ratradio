<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My RAT | RAT Radio</title>
    <style>
        /* Mengambil base style dari index.html kamu */
        *{ margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', Helvetica, Arial, sans-serif; -webkit-user-select: none; user-select: none; }
        body{ background:#000; color:#fff; overflow-x: hidden; padding-top: 80px; } /* padding agar tidak tertutup header fixed */

        /* REUSE CSS HEADER & FOOTER DARI INDEX */
        .header-container { position: fixed; top: 0; width: 100%; z-index: 1000; }
        .nav-top { height: 48px; background: #000; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #fff; padding: 0 15px; }
        .logo-main img { height: 46px; cursor: pointer; }
        .nav-right-side { display: flex; align-items: center; }
        .menu-links a { color: #fff; text-decoration: none; font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 0 15px; }
        .nav-live { height: 32px; background: #000; display: flex; align-items: center; border-bottom: 1px solid #fff; }
        .live-label { background: #fff; color: #000; height: 100%; padding: 0 12px; font-size: 10px; font-weight: 700; display: flex; align-items: center; text-transform: uppercase; }
        .current-show { padding: 0 15px; font-size: 11px; font-weight: 700; display: flex; align-items: center; text-transform: uppercase; }

        /* MY RAT SPECIFIC STYLE */
        .my-rat-container { padding: 40px 60px; min-height: 80vh; }
        .my-rat-header { margin-bottom: 40px; }
        .my-rat-header h1 { font-size: 40px; font-weight: 900; letter-spacing: -2px; }
        .my-rat-header p { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; }

        /* LIST LAYOUT (Sesuai Gambar Referensi) */
        .shows-list { border-top: 1px solid rgba(255,255,255,0.2); }
        .show-item { 
            display: flex; align-items: center; padding: 20px 0; 
            border-bottom: 1px solid rgba(255,255,255,0.2);
            position: relative;
        }
        .show-cover { width: 140px; height: 80px; object-fit: cover; margin-right: 20px; flex-shrink: 0; }
        
        .show-info { flex-grow: 1; }
        .show-info h3 { 
            font-size: 18px; font-weight: 800; text-transform: uppercase; 
            cursor: pointer; display: inline-block; transition: 0.2s;
        }
        .show-info h3:hover { opacity: 0.7; }
        .show-info p { font-size: 12px; opacity: 0.5; margin-top: 4px; font-weight: 600; }

        .show-actions { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; height: 80px; }
        .action-top .trash-btn { cursor: pointer; opacity: 0.5; transition: 0.3s; font-size: 18px; }
        .action-top .trash-btn:hover { opacity: 1; color: #ff4444; }
        
        .action-bottom { display: flex; align-items: center; gap: 15px; }
        .bookmark-btn { cursor: pointer; opacity: 0.8; font-size: 16px; }
        .share-btn { cursor: pointer; opacity: 0.8; font-size: 16px; }
        .view-btn { 
            font-size: 11px; font-weight: 800; color: #fff; text-decoration: none; 
            letter-spacing: 1px; cursor: pointer;
        }
        .view-btn:hover { text-decoration: underline; }

        /* Toast Notification */
        .toast {
            position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
            background: #fff; color: #000; padding: 8px 16px; font-size: 10px;
            font-weight: 800; text-transform: uppercase; z-index: 2000;
            display: none;
        }

        /* Re-use Player & Drawer CSS from index.html */
        /* (Sama persis seperti di index.html kamu) */
        .player-fixed { position: fixed; bottom: 0; width: 100%; height: 55px; background: #000; border-top: 1px solid #333; display: none; align-items: center; justify-content: space-between; z-index: 1000; }
        #tracklist-drawer { display: none; position: fixed; bottom: 55px; width: 100%; height: calc(100vh - 135px); background: #000; z-index: 998; overflow-y: auto; opacity: 0; transition: 0.3s; padding: 60px; }
        #tracklist-drawer.active { display: block; opacity: 1; }
        footer { background: #000; padding: 60px; border-top: 1px solid #333; }
        /* ... Sisa CSS disederhanakan agar fokus ke elemen utama ... */
    </style>
</head>
<body>

<div class="header-container">
    <div class="nav-top">
        <div class="logo-main"><a href="index.html"><img src="New Project (3).png"></a></div>
        <div class="nav-right-side">
            <div class="menu-links">
                <a href="index.html">Latest</a>
                <a href="explore.html">Explore</a>
                <a href="shop.html">Shop</a>
                <a href="my-rat.html" style="text-decoration: underline;">My RAT</a>
                <a href="about.html">About</a>
            </div>
        </div>
    </div>
</div>

<div class="my-rat-container">
    <div class="my-rat-header">
        <h1>MY RAT</h1>
        <p>Your personal collection of curated sounds and broadcast history.</p>
    </div>

    <div class="shows-list">
        <div class="show-item">
            <img src="https://i.pinimg.com/736x/4a/95/38/4a9538d1ecde6f01fca8fd9c89f1ab9f.jpg" class="show-cover">
            <div class="show-info">
                <h3 onclick="changeTrack('INTERPRETING PEACE W/ FL3X', '29 DEC 2025', 'https://i.pinimg.com/736x/4a/95/38/4a9538d1ecde6f01fca8fd9c89f1ab9f.jpg')">INTERPRETING PEACE W/ FL3X</h3>
                <p>29 DEC 2025</p>
            </div>
            <div class="show-actions">
                <div class="action-top">
                    <span class="trash-btn" onclick="removeItem(this)">🗑</span>
                </div>
                <div class="action-bottom">
                    <span class="bookmark-btn" onclick="showToast('SAVED')">🔖</span>
                    <span class="share-btn" onclick="showToast('COPIED')">🔗</span>
                    <span class="view-btn" onclick="toggleDrawerFromList('INTERPRETING PEACE W/ FL3X')">VIEW ↗</span>
                </div>
            </div>
        </div>

        <div class="show-item">
            <img src="https://i.pinimg.com/1200x/53/07/9f/53079fd51d47cc2853837bca36065fd9.jpg" class="show-cover">
            <div class="show-info">
                <h3 onclick="changeTrack('MALA JUNTA W/ SOURCE:LINK', '20 JAN 2025', 'https://i.pinimg.com/1200x/53/07/9f/53079fd51d47cc2853837bca36065fd9.jpg')">MALA JUNTA W/ SOURCE:LINK</h3>
                <p>20 JAN 2025</p>
            </div>
            <div class="show-actions">
                <div class="action-top">
                    <span class="trash-btn" onclick="removeItem(this)">🗑</span>
                </div>
                <div class="action-bottom">
                    <span class="bookmark-btn" onclick="showToast('SAVED')">🔖</span>
                    <span class="share-btn" onclick="showToast('COPIED')">🔗</span>
                    <span class="view-btn" onclick="toggleDrawerFromList('MALA JUNTA W/ SOURCE:LINK')">VIEW ↗</span>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast-msg" class="toast">SAVED</div>

<script>
    // Fungsi Toast (Saved/Copied)
    function showToast(text) {
        const toast = document.getElementById('toast-msg');
        toast.innerText = text;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    // Fungsi Hapus Item
    function removeItem(btn) {
        const item = btn.closest('.show-item');
        item.style.opacity = '0';
        setTimeout(() => { item.remove(); }, 300);
    }

    // Fungsi View (Buka Drawer)
    function toggleDrawerFromList(title) {
        // Logika untuk mengisi data drawer bisa disesuaikan
        document.getElementById('drawer-title-big').innerText = title;
        toggleDrawer(); 
    }

    // --- COPY PASTE SCRIPT PLAYER DARI INDEX.HTML KAMU KE SINI ---
    // (changeTrack, toggleDrawer, dll tetap sama agar fungsi player selaras)
</script>

</body>
</html>
