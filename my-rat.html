<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My RAT | RAT Radio</title>

<style>
/* =========================================================
   SAMA PERSIS DENGAN INDEX.HTML (JANGAN DIOTAK-ATIK)
   ========================================================= */
*{ 
    margin:0; padding:0; box-sizing:border-box; 
    font-family: 'Inter', Helvetica, Arial, sans-serif; 
    -webkit-user-select: none; 
    user-select: none;          
}
html { scroll-behavior: smooth; }
body{ background:#000; color:#fff; overflow-x: hidden; }

/* HEADER & NAV */
.header-container { position: fixed; top: 0; width: 100%; z-index: 1000; }
.nav-top { height: 48px; background: #000; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #fff; padding: 0 15px; }
.logo-main img { height: 46px; cursor: pointer; transition: 0.3s; }
.logo-main:hover img { transform: scale(1.05); }
.nav-right-side { display: flex; align-items: center; }
.menu-links a { color: #fff; text-decoration: none; font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 0 15px; transition: 0.2s; }
.menu-links a:hover { color: #888; }
.search-container { display: flex; align-items: center; padding-left: 15px; margin-left: 5px; height: 24px; border-left: 1px solid #fff; }
.search-wrapper { display: flex; align-items: center; gap: 8px; }
.search-input { background: transparent; border: none; border-bottom: 1px solid #fff; color: #fff; font-size: 12px; width: 80px; outline: none; transition: 0.4s; -webkit-user-select: text; user-select: text; }
.search-input:focus { width: 140px; }
.search-icon { width: 13px; height: 13px; border: 1.5px solid #fff; border-radius: 50%; position: relative; cursor: pointer; }
.search-icon::after { content: ""; position: absolute; width: 1.5px; height: 5px; background: #fff; bottom: -3px; right: -2px; transform: rotate(-45deg); }
.nav-live { height: 32px; background: #000; display: flex; align-items: center; border-bottom: 1px solid #fff; }
.live-label { background: #fff; color: #000; height: 100%; padding: 0 12px; font-size: 10px; font-weight: 700; display: flex; align-items: center; gap: 6px; text-transform: uppercase; }
.live-label span { color: #ff0000; font-size: 14px; animation: blink 1.5s infinite; } 
@keyframes blink { 0%, 100% {opacity:1;} 50% {opacity:0.2;} }
.current-show { padding: 0 15px; font-size: 11px; font-weight: 700; display: flex; align-items: center; text-transform: uppercase; }
.btn-toggle-small { cursor: pointer; margin-right: 12px; width: 14px; display: flex; justify-content: center; transition: 0.2s; }
.stop-square-small { width: 10px; height: 10px; background: #fff; }

/* ARCHIVE SECTION BASE */
.archive-section { padding: 120px 60px 140px 60px; background: #000; } /* Padding atas ditambah biar ga ketutup header */
.archive-header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 15px; margin-bottom: 40px; }
.archive-header h3 { font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: -1px; }
.archive-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 40px 20px; }
.archive-item { cursor: pointer; transition: 0.3s; position: relative; }
.archive-item .img-box { width: 100%; aspect-ratio: 1/1; background: #111; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); overflow: hidden; position: relative; }
.archive-item img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); transition: 0.5s; }
.archive-info b { display: block; font-size: 14px; text-transform: uppercase; font-weight: 800; margin-bottom: 4px; color: #fff; }
.archive-info span { font-size: 11px; opacity: 0.5; text-transform: uppercase; font-weight: 400; }

/* PLAYER, DRAWER & FOOTER CSS (COPY DARI INDEX.HTML) */
/* ... (Bagian CSS Player, Drawer, dan Footer diringkas namun tetap identik dengan index.html kamu) ... */
.player-fixed { position: fixed; bottom: 0; width: 100%; height: 55px; background: #000; color: #fff; display: none; align-items: center; justify-content: space-between; z-index: 1000; border-top: 1px solid rgba(255,255,255,0.2); }
/* ... (Semua style lainnya dari index.html tetap ada di sini) ... */

/* KHUSUS PENYESUAIAN LAYOUT "MY RAT" SESUAI INSTRUKSI */
.trash-icon { position: absolute; top: 10px; right: 10px; font-size: 16px; opacity: 0.5; transition: 0.3s; z-index: 10; }
.trash-icon:hover { opacity: 1; color: #ff0000; }
.view-link-row { position: absolute; bottom: 10px; right: 10px; display: flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 800; opacity: 0.7; z-index: 10; }
.view-link-row:hover { opacity: 1; }
</style>
</head>
<body>

<div class="header-container">
  <div class="nav-top">
    <div class="logo-main" onclick="location.href='index.html'"><img src="New Project (3).png" alt="RAT Radio"></div>
    <div class="nav-right-side">
      <div class="menu-links">
        <a href="index.html">Latest</a>

        <a href="my-rat.html" style="text-decoration: underline;">My RAT</a>
        <a href="about.html">About</a>
      </div>
      <div class="search-container"><div class="search-wrapper"><input type="text" class="search-input"><div class="search-icon"></div></div></div>
    </div>
  </div>
  <div class="nav-live">
    <div class="live-label">Live Now <span>●</span></div>
    <div class="current-show"><div class="btn-toggle-small" id="toggle-small">▶</div><span id="live-text-source">BASEMENT SESSIONS W/ DIRTY CAT</span></div>
  </div>
</div>

<section class="archive-section">
    <div class="archive-header"><h3>Shows</h3></div>
    <div class="archive-grid" id="shows-grid">
        <div class="archive-item">
            <div class="img-box">
                <img src="https://i.pinimg.com/736x/4a/95/38/4a9538d1ecde6f01fca8fd9c89f1ab9f.jpg" alt="Cover">
                <div class="trash-icon" title="Remove from Favorites">🗑</div>
                <div class="view-link-row" onclick="changeTrack('THE SEWER GHOST', 'GHOSTFACE', '...')">🔗 <span>VIEW ↗</span></div>
            </div>
            <div class="archive-info"><b>THE SEWER GHOST</b><span>12 FEB 2026</span></div>
        </div>
    </div>

    <div class="archive-header" style="margin-top: 80px;"><h3>History</h3></div>
    <div class="archive-grid" id="history-grid">
        </div>
</section>

<footer>
    <div class="footer-top">
        <div class="footer-suggestion">
            <h4>Suggestions / Feedback</h4>
            <div class="suggestion-box">
                <textarea id="saranText" placeholder="Write your message here..."></textarea>
                <button class="btn-send" onclick="sendSaran()">Send</button>
            </div>
        </div>
        <div class="footer-nav"><h2>RAT RADIO</h2><ul class="footer-links"><li><a href="index.html">Latest</a></li><li><a href="my-rat.html">My RAT</a></li></ul></div>
    </div>
    <div class="footer-bottom">
        <img src="New Project (3).png" class="footer-logo-img">
        <div class="copyright">2026</div>
    </div>
</footer>
