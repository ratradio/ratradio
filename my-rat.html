<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My RAT | RAT Radio</title>

<style>
/* =========================================================
   SAMA PERSIS DENGAN INDEX.HTML (CSS ASLI)
   ========================================================= */
*{ 
    margin:0; padding:0; box-sizing:border-box; 
    font-family: 'Inter', Helvetica, Arial, sans-serif; 
    -webkit-user-select: none; 
    user-select: none;          
}
html { scroll-behavior: smooth; }
body{ background:#000; color:#fff; overflow-x: hidden; }

/* HEADER & NAV */
.header-container { position: fixed; top: 0; width: 100%; z-index: 1000; }
.nav-top { height: 48px; background: #000; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #fff; padding: 0 15px; }
.logo-main img { height: 46px; cursor: pointer; transition: 0.3s; }
.nav-right-side { display: flex; align-items: center; }
.menu-links a { color: #fff; text-decoration: none; font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 0 15px; }
.search-container { display: flex; align-items: center; padding-left: 15px; margin-left: 5px; height: 24px; border-left: 1px solid #fff; }
.search-input { background: transparent; border: none; border-bottom: 1px solid #fff; color: #fff; font-size: 12px; width: 80px; outline: none; }
.nav-live { height: 32px; background: #000; display: flex; align-items: center; border-bottom: 1px solid #fff; }
.live-label { background: #fff; color: #000; height: 100%; padding: 0 12px; font-size: 10px; font-weight: 700; display: flex; align-items: center; gap: 6px; text-transform: uppercase; }

/* =========================================================
   BAGIAN TENGAH: MY RAT LIST LAYOUT (NEW)
   ========================================================= */
.my-rat-section { 
    padding: 110px 60px 140px 60px; /* Padding biar ga ketutup header */
    min-height: 100vh;
}

.archive-header { 
    display: flex; 
    justify-content: space-between; 
    align-items: flex-end; 
    border-bottom: 1px solid rgba(255,255,255,0.2); 
    padding-bottom: 15px; 
    margin-bottom: 30px; 
}
.archive-header h3 { font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: -1px; }

/* LIST ITEM STRUKTUR: COVER (KIRI) | INFO (TENGAH) | ACTIONS (KANAN) */
.list-item {
    display: flex;
    align-items: center;
    padding: 15px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    transition: 0.3s;
}
.list-item:hover { background: rgba(255,255,255,0.02); }

/* KIRI: Ukuran cover photo */
.list-item .img-box {
    width: 80px; 
    height: 80px;
    flex-shrink: 0;
    margin-right: 25px;
    background: #111;
}
.list-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(100%);
}

/* TENGAH: Info Title & Date */
.item-info {
    flex-grow: 1;
}
.item-info b {
    display: block;
    font-size: 16px;
    font-weight: 800;
    text-transform: uppercase;
    margin-bottom: 4px;
}
.item-info span {
    font-size: 11px;
    font-weight: 400;
    opacity: 0.5;
}

/* KANAN: Trash (Atas) & View (Bawah) */
.item-actions {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: flex-end;
    height: 80px; /* Samakan dengan tinggi gambar */
    padding: 5px 0;
}
.trash-btn {
    cursor: pointer;
    font-size: 16px;
    opacity: 0.4;
    transition: 0.2s;
}
.trash-btn:hover { opacity: 1; color: #ff0000; }

.view-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    font-weight: 800;
    text-decoration: none;
    color: #fff;
    opacity: 0.6;
    cursor: pointer;
}
.view-btn:hover { opacity: 1; }

/* PLAYER & FOOTER CSS (COPY DARI INDEX.HTML) */
/* Sisa CSS Player, Drawer, dan Footer kamu tetap ada di sini (Identik) */
.player-fixed { position: fixed; bottom: 0; width: 100%; height: 55px; background: #000; border-top: 1px solid rgba(255,255,255,0.2); z-index: 1000; display: none; }
/* ... (Style footer dll) ... */
</style>
</head>
<body>

<div class="header-container">
  <div class="nav-top">
    <div class="logo-main" onclick="location.href='index.html'"><img src="New Project (3).png" alt="RAT Radio"></div>
    <div class="nav-right-side">
      <div class="menu-links">
        <a href="index.html">Latest</a>
        <a href="explore.html">Explore</a>
        <a href="shop.html">Shop</a>
        <a href="my-rat.html" style="text-decoration: underline;">My RAT</a>
        <a href="about.html">About</a>
      </div>
      <div class="search-container"><div class="search-wrapper"><input type="text" class="search-input"><div class="search-icon"></div></div></div>
    </div>
  </div>
  <div class="nav-live">
    <div class="live-label">Live Now <span>●</span></div>
    <div class="current-show"><div class="btn-toggle-small" id="toggle-small">▶</div><span id="live-text-source">BASEMENT SESSIONS W/ DIRTY CAT</span></div>
  </div>
</div>

<section class="my-rat-section">
    <div class="archive-header"><h3>Shows</h3></div>
    <div id="shows-list">
        <div class="list-item">
            <div class="img-box"><img src="https://i.pinimg.com/736x/4a/95/38/4a9538d1ecde6f01fca8fd9c89f1ab9f.jpg" alt="Cover"></div>
            <div class="item-info">
                <b>THE SEWER GHOST</b>
                <span>12 FEB 2026</span>
            </div>
            <div class="item-actions">
                <div class="trash-btn" onclick="removeItem(this)">🗑</div>
                <div class="view-btn" onclick="changeTrack('THE SEWER GHOST', 'GHOSTFACE — 12 FEB 2026', 'https://i.pinimg.com/736x/4a/95/38/4a9538d1ecde6f01fca8fd9c89f1ab9f.jpg')">🔗 VIEW ↗</div>
            </div>
        </div>
    </div>

    <div class="archive-header" style="margin-top: 60px;"><h3>History</h3></div>
    <div id="history-list">
        </div>
</section>

<script>
    // 1. FUNGSI CHANGE TRACK (Panggil fungsi Player asli kamu)
    function changeTrack(title, sub, imgSrc) {
        // Ambil elemen player dari kerangka asli
        const playerBar = document.getElementById('main-player');
        document.getElementById('player-title').innerText = title;
        document.getElementById('player-sub').innerText = sub;
        document.getElementById('bottom-cover').src = imgSrc;
        
        // Munculkan player (Sama dengan fungsi di index.html)
        playerBar.style.display = 'flex';
        setTimeout(() => { playerBar.style.transform = 'translateY(0)'; }, 10);
    }

    // 2. FUNGSI REMOVE ITEM
    function removeItem(element) {
        const item = element.closest('.list-item');
        item.style.opacity = '0';
        setTimeout(() => item.remove(), 300);
    }

    // 3. LOGIC PLAYER ASLI (Paste semua script dari index.html ke sini)
    // Agar tombol play, pause, progress bar, dsb bekerja sempurna.
</script>

</body>
</html>
