<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My RAT | RAT Radio</title>

<style>
/* AMBIL PERSIS DARI INDEX.HTML */
*{ 
    margin:0; padding:0; box-sizing:border-box; 
    font-family: 'Inter', Helvetica, Arial, sans-serif; 
    -webkit-user-select: none; 
    user-select: none;          
}
html { scroll-behavior: smooth; }
body{ background:#000; color:#fff; overflow-x: hidden; }

/* HEADER */
.header-container { position: fixed; top: 0; width: 100%; z-index: 1000; }
.nav-top { height: 48px; background: #000; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #fff; padding: 0 15px; }
.logo-main img { height: 46px; cursor: pointer; transition: 0.3s; }
.nav-right-side { display: flex; align-items: center; }
.menu-links a { color: #fff; text-decoration: none; font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 0 15px; transition: 0.2s; }
.menu-links a:hover { color: #888; }

/* SEKSI UTAMA (MENGGUNAKAN STYLE ARCHIVE-SECTION) */
.my-rat-container { padding: 100px 60px 140px 60px; background: #000; }
.section-header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 15px; margin-bottom: 40px; }
.section-header h3 { font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: -1px; }

/* GRID LAYOUT (SAMA DENGAN INDEX) */
.archive-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 40px 20px; }
.archive-item { position: relative; cursor: pointer; transition: 0.3s; }
.archive-item .img-box { width: 100%; aspect-ratio: 1/1; background: #111; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); overflow: hidden; }
.archive-item img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); transition: 0.5s; }

/* INFO BAWAH */
.archive-info { position: relative; }
.archive-info b { display: block; font-size: 14px; text-transform: uppercase; font-weight: 800; margin-bottom: 4px; color: #fff; }
.archive-info span { font-size: 11px; opacity: 0.5; text-transform: uppercase; font-weight: 400; }

/* ICON ACTIONS (TRASH & VIEW) */
.item-actions { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    margin-top: 10px; 
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.05);
}
.trash-icon { cursor: pointer; opacity: 0.3; transition: 0.3s; font-size: 14px; }
.trash-icon:hover { opacity: 1; color: #ff0000; }
.view-btn { font-size: 10px; font-weight: 800; text-decoration: none; color: #fff; opacity: 0.6; }
.view-btn:hover { opacity: 1; }

/* FOOTER */
footer { background: #000; text-align: center; border-top: 1px solid rgba(255,255,255,0.1); padding: 60px; margin-top: 50px; }
.footer-logo-img { height: 60px; margin-bottom: 10px; opacity: 0.5; }
.copyright { font-size: 10px; color: #444; }
</style>
</head>
<body>

<div class="header-container">
  <div class="nav-top">
    <div class="logo-main" onclick="location.href='index.html'"><img src="New%20Project%20(3).png" alt="RAT Radio"></div>
    <div class="nav-right-side">
      <div class="menu-links">
        <a href="index.html">Latest</a>
        <a href="explore.html">Explore</a>
        <a href="shop.html">Shop</a>
        <a href="my-rat.html" style="border-bottom: 1px solid #fff;">My RAT</a>
        <a href="about.html">About</a>
      </div>
    </div>
  </div>
</div>

<div class="my-rat-container">
    <div class="section-header"><h3>Shows</h3></div>
    <div class="archive-grid" id="shows-grid">
        </div>

    <div class="section-header" style="margin-top: 80px;"><h3>History</h3></div>
    <div class="archive-grid" id="history-grid">
        </div>
</div>

<footer>
    <img src="New Project (3).png" class="footer-logo-img" alt="RAT Logo">
    <div class="copyright">2026 RAT RADIO WORLDWIDE</div>
</footer>

<script>
    // Contoh data dummy agar kamu bisa lihat hasilnya langsung
    // Nantinya ini bisa disambungkan ke sistem bookmark kamu
    const dummyData = [
        { title: "THE SEWER GHOST", sub: "GHOSTFACE — 12 FEB 2026", img: "https://i.pinimg.com/736x/4a/95/38/4a9538d1ecde6f01fca8fd9c89f1ab9f.jpg" },
        { title: "NIGHT SHIFT", sub: "MALIK — 08 FEB 2026", img: "https://i.pinimg.com/1200x/53/07/9f/53079fd51d47cc2853837bca36065fd9.jpg" }
    ];

    function loadContent() {
        const showsGrid = document.getElementById('shows-grid');
        const historyGrid = document.getElementById('history-grid');

        // Render dummy ke kedua seksi
        renderGrid(dummyData, showsGrid, 'shows');
        renderGrid(dummyData, historyGrid, 'history');
    }

    function renderGrid(data, container, type) {
        container.innerHTML = "";
        data.forEach((item, index) => {
            container.innerHTML += `
                <div class="archive-item">
                    <div class="img-box">
                        <img src="${item.img}" alt="Cover">
                    </div>
                    <div class="archive-info">
                        <b>${item.title}</b>
                        <span>${item.sub}</span>
                    </div>
                    <div class="item-actions">
                        <div class="trash-icon" onclick="deleteItem('${type}', ${index})">🗑</div>
                        <a href="#" class="view-btn">VIEW ↗</a>
                    </div>
                </div>
            `;
        });
    }

    function deleteItem(type, index) {
        alert("Menghapus item " + index + " dari " + type);
        // Logika hapus dari localStorage bisa ditaruh di sini
    }

    document.addEventListener('DOMContentLoaded', loadContent);
</script>

</body>
</html>
