<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My RAT | RAT Radio</title>

<style>
/* CSS RESET */
*{ 
    margin:0; padding:0; box-sizing:border-box; 
    font-family: 'Inter', Helvetica, Arial, sans-serif; 
    -webkit-user-select: none; 
    user-select: none;          
}

html { scroll-behavior: smooth; }
body{ background:#000; color:#fff; overflow-x: hidden; }

/* HEADER & NAV */
.header-container { position: fixed; top: 0; width: 100%; z-index: 1000; }
.nav-top { height: 48px; background: #000; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #fff; padding: 0 15px; }
.logo-main img { height: 46px; cursor: pointer; transition: 0.3s; }
.logo-main:hover img { transform: scale(1.05); }
.nav-right-side { display: flex; align-items: center; }
.menu-links a { color: #fff; text-decoration: none; font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 0 15px; transition: 0.2s; }
.menu-links a:hover { color: #888; }
.search-container { display: flex; align-items: center; padding-left: 15px; margin-left: 5px; height: 24px; border-left: 1px solid #fff; }
.search-wrapper { display: flex; align-items: center; gap: 8px; }
.search-input { background: transparent; border: none; border-bottom: 1px solid #fff; color: #fff; font-size: 12px; width: 80px; outline: none; transition: 0.4s; -webkit-user-select: text; user-select: text; }
.search-input:focus { width: 140px; }
.search-icon { width: 13px; height: 13px; border: 1.5px solid #fff; border-radius: 50%; position: relative; cursor: pointer; }
.search-icon::after { content: ""; position: absolute; width: 1.5px; height: 5px; background: #fff; bottom: -3px; right: -2px; transform: rotate(-45deg); }
.nav-live { height: 32px; background: #000; display: flex; align-items: center; border-bottom: 1px solid #fff; }
.live-label { background: #fff; color: #000; height: 100%; padding: 0 12px; font-size: 10px; font-weight: 700; display: flex; align-items: center; gap: 6px; text-transform: uppercase; }
.live-label span { color: #ff0000; font-size: 14px; animation: blink 1.5s infinite; } 
@keyframes blink { 0%, 100% {opacity:1;} 50% {opacity:0.2;} }
.current-show { padding: 0 15px; font-size: 11px; font-weight: 700; display: flex; align-items: center; text-transform: uppercase; }
.btn-toggle-small { cursor: pointer; margin-right: 12px; width: 14px; display: flex; justify-content: center; transition: 0.2s; }

/* MY RAT LIST LAYOUT */
.my-rat-content { padding: 120px 60px; min-height: 100vh; max-width: 1200px; margin: 0 auto; }
.archive-header { border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 15px; margin-bottom: 20px; }
.archive-header h3 { font-size: 24px; font-weight: 800; text-transform: uppercase; }

.list-item { 
    display: flex; align-items: center; 
    padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.1); 
    transition: 0.3s;
}

.item-cover { 
    width: 100px; height: 100px; flex-shrink: 0; 
    margin-right: 30px; filter: grayscale(100%); object-fit: cover; border: 1px solid rgba(255,255,255,0.1);
}

.item-info { flex-grow: 1; }
.item-info b { 
    display: block; font-size: 18px; font-weight: 800; 
    text-transform: uppercase; margin-bottom: 4px; 
}
.item-info span { font-size: 12px; opacity: 0.5; font-weight: 500; }

.item-actions { 
    display: flex; flex-direction: column; 
    justify-content: space-between; align-items: flex-end; 
    height: 100px; padding: 5px 0; 
}
.trash-icon { cursor: pointer; opacity: 0.4; transition: 0.3s; font-size: 18px; }
.trash-icon:hover { opacity: 1; color: #ff4444; }
.view-btn { cursor: pointer; font-size: 11px; font-weight: 800; letter-spacing: 1px; transition: 0.3s; }
.view-btn:hover { opacity: 0.6; }

/* PLAYER FIXED */
.player-fixed {
  position: fixed; bottom: 0; width: 100%; height: 55px; 
  background: #000; color: #fff; display: none; 
  align-items: center; justify-content: space-between; 
  z-index: 1000; transform: translateY(100%); 
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  border-top: 1px solid rgba(255,255,255,0.2);
}
.player-left { display: flex; align-items: center; padding-left: 20px; gap: 15px; }
.track-box { display: flex; align-items: center; gap: 12px; }
.track-box img { width: 38px; height: 38px; border: 1px solid #fff; filter: grayscale(100%); }
.title-info b { font-size: 12.5px; display: block; text-transform: uppercase; font-weight: 700; line-height: 1.2; }
.title-info span { font-size: 10px; opacity: 0.7; }
.player-right { display: flex; align-items: center; height: 100%; }
.icon-group { display: flex; align-items: center; gap: 20px; padding: 0 20px; }
.icon-group span { cursor: pointer; font-weight: 700; font-size: 14px; }
.close-btn { padding: 0 20px; cursor: pointer; border-left: 1px solid #fff; height: 100%; display: flex; align-items: center; opacity: 0.5; }

/* FOOTER */
footer { background: #000; padding: 80px 60px; border-top: 1px solid rgba(255,255,255,0.1); margin-top: 50px; text-align: center; }
.footer-logo-img { height: 60px; margin-bottom: 20px; }
.footer-social-text { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
.footer-social-text a { color: #fff; text-decoration: none; font-size: 11px; text-transform: uppercase; opacity: 0.6; }
</style>
</head>
<body>

<div class="header-container">
  <div class="nav-top">
    <div class="logo-main"><img src="New Project (3).png" alt="RAT Radio"></div>
    <div class="nav-right-side">
      <div class="menu-links">
          <a href="index.html">Latest</a>
          <a href="explore.html">Explore</a>
          <a href="my-rat.html">My RAT</a>
      </div>
    </div>
  </div>
  <div class="nav-live">
    <div class="live-label">Live Now <span>●</span></div>
    <div class="current-show">
        <div class="btn-toggle-small" id="toggle-small">▶</div> 
        <span id="live-text-source">BASEMENT SESSIONS W/ DIRTY CAT</span>
    </div>
  </div>
</div>

<main class="my-rat-content">
    <div class="archive-header"><h3>Shows</h3></div>
    <div id="shows-list">
        
        <div class="list-item">
            <img src="https://i.pinimg.com/736x/4a/95/38/4a9538d1ecde6f01fca8fd9c89f1ab9f.jpg" class="item-cover">
            <div class="item-info">
                <b>THE SEWER GHOST</b>
                <span>12 FEB 2026</span>
            </div>
            <div class="item-actions">
                <div class="trash-icon" onclick="removeItem(this)">🗑</div>
                <div class="view-btn" onclick="changeTrack('THE SEWER GHOST', 'GHOSTFACE — 12 FEB 2026', 'https://i.pinimg.com/736x/4a/95/38/4a9538d1ecde6f01fca8fd9c89f1ab9f.jpg')">VIEW ↗</div>
            </div>
        </div>

        <div class="list-item">
            <img src="https://i.pinimg.com/1200x/53/07/9f/53079fd51d47cc2853837bca36065fd9.jpg" class="item-cover">
            <div class="item-info">
                <b>NIGHT SHIFT</b>
                <span>08 FEB 2026</span>
            </div>
            <div class="item-actions">
                <div class="trash-icon" onclick="removeItem(this)">🗑</div>
                <div class="view-btn" onclick="changeTrack('NIGHT SHIFT', 'MALIK — 08 FEB 2026', 'https://i.pinimg.com/1200x/53/07/9f/53079fd51d47cc2853837bca36065fd9.jpg')">VIEW ↗</div>
            </div>
        </div>

    </div>

    <div class="archive-header" style="margin-top: 60px;"><h3>History</h3></div>
    <div id="history-list">
        </div>
</main>

<div class="player-fixed" id="main-player">
  <div class="player-left">
    <div class="btn-toggle-bottom" id="toggle-bottom">▶</div>
    <div class="track-box">
      <img src="" alt="Cover" id="bottom-cover">
      <div class="title-info"><b id="player-title">TITLE</b><span id="player-sub">SUBTITLE</span></div>
    </div>
  </div>
  <div class="player-right">
    <div class="icon-group">
        <span id="like-btn">♡</span>
        <span class="share-icon">🔗</span>
    </div>
    <div class="close-btn" onclick="closePlayer()">✕</div>
  </div>
</div>

<footer>
    <img src="New Project (3).png" class="footer-logo-img">
    <div class="footer-social-text">
        <a href="#">Instagram</a>
        <a href="#">Gmail</a>
    </div>
    <div class="copyright">2026 © RAT RADIO</div>
</footer>

<script>
    // FUNGSI HAPUS ITEM
    function removeItem(tombol) {
        if(confirm('Delete from Shows?')) {
            const item = tombol.closest('.list-item');
            item.style.opacity = '0';
            setTimeout(() => item.remove(), 300);
        }
    }

    // FUNGSI GANTI TRACK & MUNCULIN PLAYER
    function changeTrack(title, sub, imgSrc) {
        const playerBar = document.getElementById('main-player');
        document.getElementById('player-title').innerText = title;
        document.getElementById('player-sub').innerText = sub;
        document.getElementById('bottom-cover').src = imgSrc;

        playerBar.style.display = 'flex';
        setTimeout(() => { 
            playerBar.style.transform = 'translateY(0)'; 
        }, 10);
    }

    // FUNGSI TUTUP PLAYER
    function closePlayer() {
        const playerBar = document.getElementById('main-player');
        playerBar.style.transform = 'translateY(100%)';
        setTimeout(() => { playerBar.style.display = 'none'; }, 400);
    }

    // TOGGLE PLAY (SIMULASI)
    let isPlaying = false;
    document.getElementById('toggle-bottom').onclick = function() {
        isPlaying = !isPlaying;
        this.innerHTML = isPlaying ? '■' : '▶';
    };
</script>

</body>
</html>
