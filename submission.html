<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit Proposal | RAT Radio</title>
<style>
/* CSS RESET & HEADER SINKRON */
* { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', Helvetica, Arial, sans-serif; -webkit-user-select: none; user-select: none; }
body { background:#000; color:#fff; overflow-x: hidden; }

.header-container { position: fixed; top: 0; width: 100%; z-index: 1000; }
.nav-top { height: 48px; background: #000; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #fff; padding: 0 15px; }
.logo-main img { height: 46px; cursor: pointer; }
.nav-right-side { display: flex; align-items: center; }
.menu-links a { color: #fff; text-decoration: none; font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 0 15px; }
.nav-live { height: 32px; background: #000; display: flex; align-items: center; border-bottom: 1px solid #fff; }
.live-label { background: #fff; color: #000; height: 100%; padding: 0 12px; font-size: 10px; font-weight: 700; display: flex; align-items: center; gap: 6px; text-transform: uppercase; }
.live-label span { color: #ff0000; animation: blink 1.5s infinite; }
@keyframes blink { 0%, 100% {opacity:1;} 50% {opacity:0.2;} }

/* ================= FORM STYLE ================= */
.form-container { padding: 140px 60px 150px 60px; max-width: 700px; margin: 0; }
.form-title { font-size: 24px; font-weight: 900; text-transform: uppercase; margin-bottom: 40px; letter-spacing: 1px; }

.section-label { font-size: 14px; font-weight: 700; margin-bottom: 25px; display: block; }
.form-group { margin-bottom: 45px; }

input[type="text"], input[type="email"], textarea {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    padding: 10px 0;
    font-size: 13px;
    text-transform: uppercase;
    outline: none;
    transition: 0.3s;
    -webkit-user-select: text; user-select: text;
}
input:focus, textarea:focus { border-bottom: 1px solid #fff; }

textarea { height: 100px; resize: none; border: 1px solid rgba(255,255,255,0.3); padding: 15px; text-transform: none; }
.help-text { font-size: 10px; opacity: 0.5; margin-top: 8px; text-transform: uppercase; letter-spacing: 0.5px; line-height: 1.4; }

.btn-send {
    background: #555;
    color: #000;
    border: none;
    padding: 15px 40px;
    font-weight: 900;
    font-size: 14px;
    text-transform: uppercase;
    cursor: pointer;
    float: right;
    margin-top: 20px;
    transition: 0.3s;
}
.btn-send:hover { background: #fff; }

/* PLAYER FIXED */
.player-fixed { position: fixed; bottom: 0; width: 100%; height: 55px; background: #000; display: flex; align-items: center; justify-content: space-between; z-index: 1000; border-top: 1px solid rgba(255,255,255,0.2); }
.close-btn { padding: 0 20px; cursor: pointer; opacity: 0.4; border-left: 1px solid #fff; height: 100%; display: flex; align-items: center; }
.close-btn:hover { background: rgba(255,255,255,0.1); opacity: 1; }
</style>
</head>
<body>

<div class="header-container">
    <div class="nav-top">
        <div class="logo-main" onclick="window.location.href='index.html'"><img src="New Project (3).png"></div>
        <div class="nav-right-side">
            <div class="menu-links">
                <a href="index.html">Latest</a>
                <a href="explore.html">Explore</a>
                <a href="shop.html">Shop</a>
                <a href="about.html">About</a>
            </div>
        </div>
    </div>
    <div class="nav-live">
        <div class="live-label">Live Now <span>●</span></div>
        <div class="current-show"><span style="padding-left:15px; font-size:11px; font-weight:700;">BASEMENT SESSIONS W/ DIRTY CAT</span></div>
    </div>
</div>

<main class="form-container">
    <h1 class="form-title">Radio Show Proposal</h1>
    
    <div class="form-group">
        <label class="section-label">What's your proposal for a radio show?</label>
        <input type="text" placeholder="PROPOSED SHOW TITLE">
    </div>

    <div class="form-group">
        <textarea placeholder="DESCRIBE THE SHOW *" maxlength="600"></textarea>
        <div class="help-text">600 characters left.</div>
    </div>

    <div class="form-group">
        <label class="section-label">Audio links</label>
        <p class="help-text" style="margin-bottom: 15px; font-size: 11px; opacity: 0.9;">Include a weblink to your show demo. Please use only Soundcloud, Mixcloud or Youtube.</p>
        <input type="text" placeholder="LINK TO DEMO AUDIO *">
    </div>

    <div class="form-group">
        <input type="text" placeholder="GENRES">
        <div class="help-text">Max 5, please separate genres by comma.</div>
    </div>

    <div class="form-group" style="margin-top: 60px;">
        <label class="section-label">Please tell us something about you:</label>
        <input type="text" placeholder="FULL NAME *" style="margin-bottom: 25px;">
        <input type="text" placeholder="ARTIST NAME" style="margin-bottom: 25px;">
        <input type="email" placeholder="EMAIL *" style="margin-bottom: 25px;">
        <input type="text" placeholder="SOCIAL MEDIA LINKS" style="margin-bottom: 5px;">
        <div class="help-text" style="margin-bottom: 25px;">Please separate links by comma.</div>
        <input type="text" placeholder="CITY *">
    </div>

    <button class="btn-send">SEND</button>
</main>

<div class="player-fixed">
    <div style="padding-left:20px; display:flex; align-items:center;">
        <div style="font-size:22px; margin-right:15px;">▶</div>
        <b style="font-size:12.5px; text-transform: uppercase;">Submission Mode</b>
    </div>
    <div class="close-btn" onclick="window.location.href='about.html'">✕</div>
</div>

</body>
</html>
