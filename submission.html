<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit | RAT Radio</title>

<style>
/* CSS RESET & ANTI-BLOK */
*{ 
    margin:0; padding:0; box-sizing:border-box; 
    font-family: 'Inter', Helvetica, Arial, sans-serif; 
    -webkit-user-select: none; 
    user-select: none;          
}

html { scroll-behavior: smooth; }
body{ background:#000; color:#fff; overflow-x: hidden; }

/* ================= HEADER CONTAINER (TETAP) ================= */
.header-container { position: fixed; top: 0; width: 100%; z-index: 1000; }
.nav-top { height: 48px; background: #000; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #fff; padding: 0 15px; }
.logo-main img { height: 46px; cursor: pointer; transition: 0.3s; }
.logo-main:hover img { transform: scale(1.05); }
.nav-right-side { display: flex; align-items: center; }
.menu-links a { color: #fff; text-decoration: none; font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 0 15px; transition: 0.2s; cursor: pointer; }
.menu-links a:hover { color: #888; }
.search-container { display: flex; align-items: center; padding-left: 15px; margin-left: 5px; height: 24px; border-left: 1px solid #fff; }
.search-wrapper { display: flex; align-items: center; gap: 8px; }
.search-input { background: transparent; border: none; border-bottom: 1px solid #fff; color: #fff; font-size: 12px; width: 80px; outline: none; transition: 0.4s; -webkit-user-select: text; user-select: text; }
.search-input:focus { width: 140px; }
.search-icon { width: 13px; height: 13px; border: 1.5px solid #fff; border-radius: 50%; position: relative; cursor: pointer; }
.search-icon::after { content: ""; position: absolute; width: 1.5px; height: 5px; background: #fff; bottom: -3px; right: -2px; transform: rotate(-45deg); }
.nav-live { height: 32px; background: #000; display: flex; align-items: center; border-bottom: 1px solid #fff; }
.live-label { background: #fff; color: #000; height: 100%; padding: 0 12px; font-size: 10px; font-weight: 700; display: flex; align-items: center; gap: 6px; text-transform: uppercase; }
.live-label span { color: #ff0000; font-size: 14px; animation: blink 1.5s infinite; } 
@keyframes blink { 0%, 100% {opacity:1;} 50% {opacity:0.2;} }
.current-show { padding: 0 15px; font-size: 11px; font-weight: 700; display: flex; align-items: center; text-transform: uppercase; }
.btn-toggle-small { cursor: pointer; margin-right: 12px; width: 14px; display: flex; justify-content: center; }
.stop-square-small { width: 10px; height: 10px; background: #fff; }

/* ================= FORM CONTENT ================= */
.form-content { padding: 140px 60px 140px 60px; max-width: 900px; }
.form-header h1 { font-size: 80px; font-weight: 800; text-transform: uppercase; letter-spacing: -5px; margin-bottom: 60px; line-height: 0.8; }

.section-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px; display: block; opacity: 0.5; margin-top: 50px; }
.form-group { margin-bottom: 30px; max-width: 750px; }

input[type="text"], input[type="email"], input[type="tel"], textarea {
    width: 100%; background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.3);
    color: #fff; padding: 12px 0; font-size: 16px; font-weight: 500; text-transform: uppercase; outline: none; transition: 0.3s;
    -webkit-user-select: text; user-select: text;
}
input:focus, textarea:focus { border-bottom: 1px solid #fff; }
textarea { height: 80px; resize: none; }

/* FILE UPLOAD */
.file-wrapper { margin-top: 10px; }
.custom-file-btn { border: 1px dashed rgba(255,255,255,0.3); padding: 15px; display: block; text-align: center; font-size: 10px; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: 0.2s; }
.custom-file-btn:hover { border-color: #fff; background: rgba(255,255,255,0.05); }
input[type="file"] { display: none; }

.help-text { font-size: 10px; opacity: 0.4; margin-top: 8px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }

.btn-send-wrapper { width: 100%; max-width: 750px; display: flex; justify-content: flex-end; margin-top: 60px; }
.btn-send { border: 1px solid #fff; background: transparent; color: #fff; padding: 12px 50px; font-size: 12px; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: 0.2s; }
.btn-send:hover { background: #fff; color: #000; }

.about-footer-note { margin-top: 60px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 30px; font-size: 11px; font-weight: 700; text-transform: uppercase; opacity: 0.4; letter-spacing: 1px; padding-bottom: 100px; }

/* ================= PLAYER FIXED (TETAP) ================= */
.player-fixed { position: fixed; bottom: 0; width: 100%; height: 55px; background: #000; color: #fff; display: none; align-items: center; justify-content: space-between; z-index: 1000; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); border-top: 1px solid rgba(255,255,255,0.2); }
.progress-container { position: absolute; top: -3px; left: 0; width: 100%; height: 6px; background: rgba(255,255,255,0.1); cursor: pointer; display: flex; align-items: center; }
.progress-bar { height: 100%; background: #fff; width: 0%; position: relative; }
.player-left { display: flex; align-items: center; padding-left: 20px; gap: 15px; }
.btn-toggle-bottom { cursor: pointer; font-size: 22px; width: 25px; display: flex; justify-content: center; }
.stop-square-bottom { width: 14px; height: 14px; background: #fff; } 
.track-box { display: flex; align-items: center; gap: 12px; }
.track-box img { width: 38px; height: 38px; border: 1px solid #fff; }
.title-info b { font-size: 12.5px; display: block; text-transform: uppercase; }
.player-right { display: flex; align-items: center; height: 100%; }
.icon-group { display: flex; align-items: center; gap: 20px; padding: 0 20px; }
.up-next-btn { padding: 0 20px; font-weight: 700; font-size: 11px; color: #fff; text-decoration: none; }
.close-btn { padding: 0 20px; font-size: 18px; cursor: pointer; border-left: 1px solid #fff; opacity: 0.4; height: 100%; display: flex; align-items: center; }
</style>
</head>
<body>

<div class="header-container">
  <div class="nav-top">
    <div class="logo-main" onclick="window.location.href='index.html'"><img src="New Project (3).png"></div>
    <div class="nav-right-side">
      <div class="menu-links">
          <a href="index.html">Latest</a>
          <a href="explore.html">Explore</a>
          <a href="shop.html">Shop</a>
          <a href="about.html">About</a>
      </div>
      <div class="search-container">
        <div class="search-wrapper">
          <input type="text" class="search-input">
          <div class="search-icon"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="nav-live">
    <div class="live-label">Live Now <span>●</span></div>
    <div class="current-show">
        <div class="btn-toggle-small" id="toggle-small">▶</div> 
        <span id="live-text-source">BASEMENT SESSIONS W/ DIRTY CAT</span>
    </div>
  </div>
</div>

<main class="form-content">
    <div class="form-header"><h1>RAT<br>SUBMISSION</h1></div>

    <form action="#" method="POST" enctype="multipart/form-data">
        
        <label class="section-label">Mixtape Data</label>
        <div class="form-group"><input type="text" name="mixtape_title" placeholder="MIXTAPE TITLE *" required></div>
        <div class="form-group"><input type="text" name="genres" placeholder="GENRES (MAX 5) *" required></div>
        <div class="form-group"><input type="text" name="ambient_tags" placeholder="AMBIENT / TAGS"></div>
        <div class="form-group">
            <input type="text" name="duration" placeholder="DURATION *">
            <p class="help-text">Min 50 mins - Max 2 hours</p>
        </div>

        <label class="section-label">The Person Behind</label>
        <div class="form-group"><input type="text" name="name_alias" placeholder="NAME / ALIAS *" required></div>
        <div class="form-group"><input type="text" name="location" placeholder="COUNTRY & CITY *" required></div>
        <div class="form-group"><textarea name="about_you" placeholder="TELL US ABOUT YOURSELF *" required></textarea></div>
        <div class="form-group"><input type="tel" name="contact" placeholder="CONTACT NUMBER (WHATSAPP) *" required></div>
        <div class="form-group"><input type="text" name="instagram" placeholder="INSTAGRAM ACCOUNT"></div>
        <div class="form-group"><input type="text" name="mixcloud" placeholder="MIXCLOUD ACCOUNT"></div>

        <label class="section-label">Attach File</label>
        <div class="form-group file-wrapper">
            <label class="custom-file-btn">
                <input type="file" name="mixtape_file" accept=".mp3" required>
                <span>Upload Mixtape [MP3] *</span>
            </label>
        </div>
        <div class="form-group file-wrapper">
            <label class="custom-file-btn">
                <input type="file" name="profile_pic" accept="image/*" required>
                <span>Profile Picture *</span>
            </label>
        </div>
        <div class="form-group file-wrapper">
            <label class="custom-file-btn">
                <input type="file" name="cover_alts" accept="image/*" multiple required>
                <span>Two picture alternatives for show cover *</span>
            </label>
        </div>

        <div class="btn-send-wrapper">
            <button type="submit" class="btn-send">SEND</button>
        </div>
    </form>

    <div class="about-footer-note">
        RAT RADIO. ESTABLISHED 2026. PERPETUALLY UNDER EVERYTHING.
    </div>
</main>

<div class="player-fixed" id="main-player">
  <div class="progress-container" id="p-cont"><div class="progress-bar" id="p-bar"></div></div>
  <div class="player-left">
    <div class="btn-toggle-bottom" id="toggle-bottom">▶</div>
    <div class="track-box">
      <img src="" id="bottom-cover">
      <div class="title-info"><b id="player-title">TITLE</b></div>
    </div>
  </div>
  <div class="player-right">
    <div class="icon-group"><span>⟲ 30</span><span>⟳ 30</span></div>
    <div class="close-btn" id="close-player">✕</div>
  </div>
</div>

<script>
  // Script Nama File (Visual Feedback)
  document.querySelectorAll('input[type="file"]').forEach(input => {
      input.addEventListener('change', function() {
          const fileName = this.files.length > 1 ? `${this.files.length} FILES SELECTED` : this.files[0].name.toUpperCase();
          this.nextElementSibling.innerText = fileName;
          this.parentElement.style.borderColor = "#fff";
      });
  });

  // Sisanya (Logic Header & Player tetap dipertahankan)
  const smallBtn = document.getElementById('toggle-small');
  const bottomBtn = document.getElementById('toggle-bottom');
  const playerBar = document.getElementById('main-player');
  const closePlayer = document.getElementById('close-player');

  smallBtn.addEventListener('click', () => {
    playerBar.style.display = 'flex';
    setTimeout(() => { playerBar.style.transform = 'translateY(0)'; }, 10);
  });
  closePlayer.addEventListener('click', () => {
    playerBar.style.transform = 'translateY(100%)';
    setTimeout(() => { playerBar.style.display = 'none'; }, 400);
  });
</script>
</body>
</html>
