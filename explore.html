<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore | RAT Radio</title>
<style>
    /* CSS DASAR - BIAR SAMA KAYAK HOME */
    *{ margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', sans-serif; -webkit-user-select: none; user-select: none; }
    body{ background:#000; color:#fff; overflow-x: hidden; }
    
    /* HEADER STYLES */
    .header-container { position: fixed; top: 0; width: 100%; z-index: 1000; }
    .nav-top { height: 48px; background: #000; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #fff; padding: 0 15px; }
    .logo-main img { height: 46px; cursor: pointer; }
    .nav-right-side { display: flex; align-items: center; }
    .menu-links a { color: #fff; text-decoration: none; font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 0 15px; cursor: pointer; }
    .menu-links a:hover { color: #888; }
    .search-container { display: flex; align-items: center; padding-left: 15px; border-left: 1px solid #fff; height: 24px; margin-left: 5px; }
    .search-input { background: transparent; border: none; border-bottom: 1px solid #fff; color: #fff; font-size: 12px; width: 80px; outline: none; transition: 0.4s; }
    .search-input:focus { width: 140px; }
    .nav-live { height: 32px; background: #000; display: flex; align-items: center; border-bottom: 1px solid #fff; }
    .live-label { background: #fff; color: #000; height: 100%; padding: 0 12px; font-size: 10px; font-weight: 700; display: flex; align-items: center; gap: 6px; text-transform: uppercase; }
    .live-label span { color: #ff0000; animation: blink 1.5s infinite; }
    @keyframes blink { 0%, 100% {opacity:1;} 50% {opacity:0.2;} }

    /* CONTENT EXPLORE (Halaman Utama Explore) */
    .explore-main { padding: 140px 60px; min-height: 100vh; }
    .explore-main h1 { font-size: 80px; font-weight: 800; letter-spacing: -5px; line-height: 0.8; text-transform: uppercase; margin-bottom: 40px; }

    /* PLAYER STYLES (IDENTIK INDEX) */
    .player-fixed { position: fixed; bottom: 0; width: 100%; height: 55px; background: #000; border-top: 1px solid rgba(255,255,255,0.2); display: none; align-items: center; justify-content: space-between; z-index: 1000; transform: translateY(100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    .progress-container { position: absolute; top: -3px; left: 0; width: 100%; height: 6px; background: rgba(255,255,255,0.1); cursor: pointer; }
    .progress-bar { height: 100%; background: #fff; width: 0%; position: relative; }
    .player-left { display: flex; align-items: center; padding-left: 20px; gap: 15px; }
    .btn-toggle-bottom { cursor: pointer; font-size: 22px; width: 25px; display: flex; justify-content: center; }
    .track-box { display: flex; align-items: center; gap: 12px; }
    .track-box img { width: 38px; height: 38px; border: 1px solid #fff; filter: grayscale(100%); }
    .title-info b { font-size: 12.5px; display: block; text-transform: uppercase; }
    .title-info span { font-size: 10px; opacity: 0.7; }
    .player-right { display: flex; align-items: center; height: 100%; }
    .icon-group { display: flex; gap: 20px; padding: 0 20px; align-items: center; }
    .icon-group span { cursor: pointer; font-weight: 700; }
    .divider { width: 1px; height: 100%; background: #fff; opacity: 0.2; }
    .up-next-btn { display: flex; align-items: center; padding: 0 20px; font-weight: 700; font-size: 11px; color: #fff; text-decoration: none; cursor: pointer; }
    .close-btn { padding: 0 20px; font-size: 18px; cursor: pointer; border-left: 1px solid #fff; opacity: 0.4; height: 100%; display: flex; align-items: center; }
    
    /* STOP SQUARE STYLE */
    .stop-square-small { width: 10px; height: 10px; background: #fff; }
    .stop-square-bottom { width: 14px; height: 14px; background: #fff; }
</style>
</head>
<body>

<div class="header-container">
  <div class="nav-top">
    <div class="logo-main" onclick="window.location.href='index.html'"><img src="New Project (3).png"></div>
    <div class="nav-right-side">
      <div class="menu-links">
          <a href="index.html">Latest</a>
          <a href="explore.html" style="color: #888;">Explore</a>
          <a href="shop.html">Shop</a>
          <a href="about.html">About</a>
      </div>
      <div class="search-container">
        <input type="text" class="search-input">
        <div style="cursor:pointer; margin-left:10px;">🔍</div>
      </div>
    </div>
  </div>
  <div class="nav-live">
    <div class="live-label">Live Now <span>●</span></div>
    <div style="padding: 0 15px; font-size: 11px; font-weight: 700; display: flex; align-items: center;">
        <div id="toggle-small" style="cursor:pointer; margin-right:12px;">▶</div> 
        <span>BASEMENT SESSIONS W/ DIRTY CAT</span>
    </div>
  </div>
</div>

<main class="explore-main">
    <h1>EXPLORE<br>ARCHIVE</h1>
    <p style="font-size: 18px; opacity: 0.5; max-width: 600px;">[ SINI LO ISI SAMA KONTEN EKSPLORE LO YANG SEBELUMNYA ]</p>
</main>

<div class="player-fixed" id="main-player">
  <div class="progress-container" id="p-cont"><div class="progress-bar" id="p-bar"></div></div>
  <div class="player-left">
    <div class="btn-toggle-bottom" id="toggle-bottom">▶</div>
    <div class="track-box">
      <img src="https://i.pinimg.com/736x/bb/02/21/bb022133bdc7fcbea9b48e12a33d8160.jpg" id="bottom-cover">
      <div class="title-info"><b id="player-title">LIVE SHOW</b><span id="player-sub">NOW PLAYING</span></div>
    </div>
  </div>
  <div class="player-right">
    <div class="icon-group">
        <span onclick="seek(-30)">⟲ 30</span>
        <span onclick="seek(30)">⟳ 30</span>
    </div>
    <div class="divider"></div>
    <div class="icon-group">
        <span id="like-btn">♡</span>
        <span>🔗</span>
        <span>☰</span>
    </div>
    <a href="index.html" class="up-next-btn">UP NEXT ▲</a>
    <div class="close-btn" id="close-player">✕</div>
  </div>
</div>

<script>
  const smallBtn = document.getElementById('toggle-small');
  const bottomBtn = document.getElementById('toggle-bottom');
  const playerBar = document.getElementById('main-player');
  const progressBar = document.getElementById('p-bar');
  const pContainer = document.getElementById('p-cont');

  let isPlaying = false; let playerVisible = false; let currentProgress = 0; let progressInterval;

  function showPlayer() { 
      if(!playerVisible){ 
          playerBar.style.display='flex'; 
          setTimeout(()=>playerBar.style.transform='translateY(0)',10); 
          playerVisible=true; 
      } 
  }

  function updateIcons() { 
    bottomBtn.innerHTML = isPlaying ? '<div class="stop-square-bottom"></div>' : '▶'; 
    smallBtn.innerHTML = isPlaying ? '<div class="stop-square-small"></div>' : '▶'; 
    if(isPlaying) {
        clearInterval(progressInterval);
        progressInterval = setInterval(() => { if(currentProgress < 100) { currentProgress += 0.1; progressBar.style.width = currentProgress + "%"; } }, 100);
    } else { clearInterval(progressInterval); }
  }

  smallBtn.addEventListener('click', () => { isPlaying = !isPlaying; showPlayer(); updateIcons(); });
  bottomBtn.addEventListener('click', () => { isPlaying = !isPlaying; updateIcons(); });
  document.getElementById('like-btn').addEventListener('click', function() { this.innerText = (this.innerText === '♡') ? '♥' : '♡'; });
  document.getElementById('close-player').addEventListener('click', () => { playerBar.style.transform = 'translateY(100%)'; setTimeout(()=> { playerBar.style.display='none'; playerVisible=false; isPlaying=false; updateIcons(); }, 400); });
</script>
</body>
</html>
