<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My RAT | RAT Radio</title>

<style>
/* MENGAMBIL CSS DARI INDEX.HTML */
*{ 
    margin:0; padding:0; box-sizing:border-box; 
    font-family: 'Inter', Helvetica, Arial, sans-serif; 
    -webkit-user-select: none; 
    user-select: none;          
}
body{ background:#000; color:#fff; overflow-x: hidden; }

/* HEADER (Sama dengan Index) */
.header-container { position: fixed; top: 0; width: 100%; z-index: 1000; }
.nav-top { height: 48px; background: #000; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #fff; padding: 0 15px; }
.logo-main img { height: 46px; cursor: pointer; }
.nav-right-side { display: flex; align-items: center; }
.menu-links a { color: #fff; text-decoration: none; font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 0 15px; }
.menu-links a:hover { color: #888; }

/* KHUSUS HALAMAN MY RAT */
.my-rat-section { padding: 120px 60px 60px 60px; min-height: 80vh; }
.section-title { font-size: 40px; font-weight: 800; letter-spacing: -2px; text-transform: uppercase; margin-bottom: 40px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px; }

/* GRID LAYOUT UNTUK LIST ITEMS (Minimalist Design) */
.rat-list { display: flex; flex-direction: column; gap: 20px; margin-bottom: 60px; }

.rat-item { 
    display: flex; 
    align-items: center; 
    padding: 15px 0; 
    border-bottom: 1px solid rgba(255,255,255,0.1); 
}

/* Kiri: Grayscale Cover */
.item-cover { width: 80px; height: 80px; filter: grayscale(100%); object-fit: cover; margin-right: 20px; border: 1px solid rgba(255,255,255,0.1); }

/* Tengah: Info */
.item-info { flex: 1; }
.item-info b { display: block; font-size: 16px; text-transform: uppercase; font-weight: 800; }
.item-info span { font-size: 12px; opacity: 0.5; }

/* Kanan: Actions */
.item-actions { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; height: 80px; }
.delete-btn { cursor: pointer; opacity: 0.4; transition: 0.3s; font-size: 18px; }
.delete-btn:hover { opacity: 1; }
.view-link { color: #fff; text-decoration: none; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.view-link:hover { text-decoration: underline; }

/* FOOTER (Sama dengan Index) */
footer { background: #000; padding: 80px 60px 60px 60px; border-top: 1px solid rgba(255,255,255,0.2); margin-top: 50px; }
.footer-logo-img { height: 85px; margin-bottom: 10px; }
.footer-bottom { text-align: center; }
.copyright { font-size: 10px; color: #444; margin-top: 20px; }
</style>
</head>
<body>

<div class="header-container">
  <div class="nav-top">
    <div class="logo-main" onclick="location.href='index.html'"><img src="New%20Project%20(3).png" alt="RAT Radio"></div>
    <div class="nav-right-side">
      <div class="menu-links">
        <a href="index.html">Latest</a>
        <a href="explore.html">Explore</a>
        <a href="shop.html">Shop</a>
        <a href="my-rat.html" style="text-decoration: underline;">My RAT</a>
        <a href="about.html">About</a>
      </div>
    </div>
  </div>
</div>

<section class="my-rat-section">
    <h2 class="section-title">Shows</h2>
    <div id="shows-list" class="rat-list">
        </div>

    <h2 class="section-title" style="margin-top: 80px;">History</h2>
    <div id="history-list" class="rat-list">
        </div>
</section>

<footer>
    <div class="footer-bottom">
        <img src="New Project (3).png" class="footer-logo-img" alt="RAT Logo">
        <div class="copyright">2026 RAT RADIO WORLDWIDE</div>
    </div>
</footer>

<script>
    // Fungsi menampilkan data
    function renderLists() {
        const showsList = document.getElementById('shows-list');
        const historyList = document.getElementById('history-list');

        // Ambil data dari localStorage
        const savedShows = JSON.parse(localStorage.getItem('favoritedShows')) || [];
        const savedHistory = JSON.parse(localStorage.getItem('listeningHistory')) || [];

        // Render Shows
        showsList.innerHTML = savedShows.length ? '' : '<p style="opacity:0.3">No favorited shows yet.</p>';
        savedShows.forEach((item, index) => {
            showsList.innerHTML += createItemHTML(item, 'shows', index);
        });

        // Render History
        historyList.innerHTML = savedHistory.length ? '' : '<p style="opacity:0.3">Your listening history is empty.</p>';
        savedHistory.forEach((item, index) => {
            historyList.innerHTML += createItemHTML(item, 'history', index);
        });
    }

    function createItemHTML(item, type, index) {
        return `
            <div class="rat-item">
                <img src="${item.img}" class="item-cover">
                <div class="item-info">
                    <b>${item.title}</b>
                    <span>${item.date}</span>
                </div>
                <div class="item-actions">
                    <span class="delete-btn" onclick="removeItem('${type}', ${index})">🗑</span>
                    <a href="#" class="view-link"><span>🔗</span> VIEW ↗</a>
                </div>
            </div>
        `;
    }

    // Fungsi Hapus
    window.removeItem = function(type, index) {
        if (type === 'shows') {
            let data = JSON.parse(localStorage.getItem('favoritedShows'));
            data.splice(index, 1);
            localStorage.setItem('favoritedShows', JSON.stringify(data));
        } else {
            let data = JSON.parse(localStorage.getItem('listeningHistory'));
            data.splice(index, 1);
            localStorage.setItem('listeningHistory', JSON.stringify(data));
        }
        renderLists();
    }

    // Jalankan saat load
    document.addEventListener('DOMContentLoaded', renderLists);
</script>

</body>
</html>
